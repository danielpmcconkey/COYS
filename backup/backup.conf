# Shared settings for the backup scripts. No secrets here:
# the DB password is in ~dan/.pgpass, the Drive credentials in ~dan/.config/rclone/.
DB=sonofleo_prod
ROLE=sonofleo_backup
DEST=/mnt/media/Backups/postgres/sonofleo_prod
LOG_DIR=/media/dan/fdrive/codeprojects/COYS/logs/backup
KEEP_DAYS=14
REMOTE=gdrive-crypt:postgres/sonofleo_prod
MONTHLY_GLOB="$DB-????-??-01.dump"

# BusinessRecords: weekly tar.gz, 5 weeks plus every month's first, locally and in Drive
RECORDS_SRC=/mnt/media/BusinessRecords
RECORDS_DEST=/mnt/media/Backups/businessrecords
RECORDS_REMOTE=gdrive-crypt:businessrecords
RECORDS_KEEP_DAYS=35
RECORDS_KEEP_COUNT=5
